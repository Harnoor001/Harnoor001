name: Refresh profile panels

# Re-renders the live panels (whoami card + contribution graph) from fresh
# GitHub data. Daily on a schedule, on every push to main, and on demand.

on:
  schedule:
    - cron: "23 0 * * *" # 00:23 UTC = 05:53 IST
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh-profile.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch contribution calendar and repo stats
        run: python scripts/fetch_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render live SVGs
        run: |
          python scripts/render_neofetch.py
          python scripts/render_heatmap.py

      - name: Commit if anything changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile panels [skip ci]"
          # credit the bot, not the profile owner, so these daily commits
          # never count toward the contribution graph
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "data/github.json assets/neofetch.svg assets/contributions.svg"
