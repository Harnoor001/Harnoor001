<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><style>.up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.p{animation:pop .4s ease-out both}@keyframes pop{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#e5536f"/><stop offset=".5" stop-color="#d2a8ff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient><linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect width="440" height="250" rx="12"/></clipPath></defs><g class="up"><rect x=".5" y=".5" width="439" height="249" rx="12" fill="#161b22" stroke="#30363d"/><g clip-path="url(#card)"><rect width="440" height="3" fill="url(#edge)"/><rect y="0" width="90" height="3" fill="url(#sheen)" x="-90"><animate attributeName="x" values="-90;440;440" keyTimes="0;.35;1" dur="5s" begin="1s" repeatCount="indefinite"/></rect></g><g transform="translate(24 30)" fill="none" stroke="#7d8590" stroke-width="1.5"><path d="M2 1.5h9.5v12H3.5a1.5 1.5 0 0 0-1.5 1.5zM2 15v-13.5"/><path d="M5 15v3l1.5-1 1.5 1v-3"/></g><text x="46" y="46" font-size="16" fill="#58a6ff" font-weight="700" textLength="253.8" lengthAdjust="spacingAndGlyphs">TOPSIS-Summarizer-Selection</text><g class="p" style="animation-delay:.5s"><rect x="24" y="62" width="47.6" height="22" rx="11" fill="none" stroke="#3fb950" stroke-opacity=".6"/><circle cx="36" cy="73" r="3.5" fill="#3fb950"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><text x="45" y="77.5" font-size="12" fill="#3fb950" textLen